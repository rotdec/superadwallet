function suggestCategory(description, categories) {
  if (!description || description.length < 2) return null;
  const lower = description.toLowerCase();
  let best = null, bestScore = 0;
  for (const [catId, keywords] of Object.entries(CAT_KEYWORDS)) {
    for (const kw of keywords) {
      if (lower.includes(kw)) {
        const score = kw.length; // longer match = more specific
        if (score > bestScore) { bestScore = score; best = catId; }
      }
    }
  }
  if (!best) return null;
  return categories.find(c => c.id === best) || null;
}

function processRecurring(recurrings, transactions) {
  const newTx = [];
  const today = todayStr();
  recurrings.forEach(r => {
    if (!r.enabled) return;
    const existing = new Set(transactions.filter(t => t.recurringId === r.id).map(t => t.date));
    let cursor = new Date(r.startDate + "T00:00:00");
    const end = new Date(today + "T00:00:00");
    while (cursor <= end) {
      const ds = cursor.toISOString().split("T")[0];
      if (!existing.has(ds)) {
        newTx.push({ id: uid(), date: ds, amount: r.amount, type: "uscita", categoryId: r.categoryId, description: r.name, paymentMethod: "Bonifico", notes: `Auto: ${r.name}`, recurringId: r.id, auto: true });
      }
      if (r.frequency === "mensile") cursor = new Date(cursor.getFullYear(), cursor.getMonth() + 1, cursor.getDate());
      else cursor = new Date(cursor.getFullYear() + 1, cursor.getMonth(), cursor.getDate());
    }
  });
  return newTx;
}

function Sheet({ title, onClose, onSave, saveLabel = "Fine", children }) {
  return (
    <div className="sheet-overlay" onClick={e => e.target === e.currentTarget && onClose()}>

// ─────────────────────────────────────────────────────────────
// PROGETTI screen — tag breakdown
// ─────────────────────────────────────────────────────────────
function Progetti({ transactions, categories }) {
  const [selected, setSelected] = useState(null);

  // Collect all unique non-empty tags
  const allTags = useMemo(() => {
    const s = new Set(transactions.map(t => t.tag).filter(Boolean));
    return [...s].sort();
  }, [transactions]);

  // Build per-tag summary
  const tagSummaries = useMemo(() => {
    return allTags.map(tag => {
      const txs = transactions.filter(t => t.tag === tag);
      const exp = txs.filter(t => t.type === "uscita").reduce((s, t) => s + t.amount, 0);
      const inc = txs.filter(t => t.type === "entrata").reduce((s, t) => s + t.amount, 0);
      const dates = txs.map(t => t.date).sort();
      const bycat = {};
      txs.filter(t => t.type === "uscita").forEach(t => { bycat[t.categoryId] = (bycat[t.categoryId] || 0) + t.amount; });
      const breakdown = Object.entries(bycat)
        .map(([id, amt]) => ({ cat: categories.find(c => c.id === id) || { name: "Altro", icon: "📦", color: "#8E8E93" }, amt }))
        .sort((a, b) => b.amt - a.amt);
      return { tag, txs, exp, inc, net: inc - exp, dates, breakdown, count: txs.length };
    }).sort((a, b) => b.exp - a.exp);
  }, [allTags, transactions, categories]);

  // Tag emoji auto-picker based on name
  const tagEmoji = name => {
    const n = name.toLowerCase();
    if (n.includes("vacanz") || n.includes("viaggio") || n.includes("trip")) return "✈️";
    if (n.includes("matrimon") || n.includes("wedding")) return "💒";
    if (n.includes("trasloco") || n.includes("casa")) return "📦";
    if (n.includes("ristruttur") || n.includes("lavori")) return "🔨";
    if (n.includes("natale") || n.includes("christmas")) return "🎄";
    if (n.includes("compleanno") || n.includes("birthday")) return "🎂";
    if (n.includes("lavoro") || n.includes("business") || n.includes("work")) return "💼";
    if (n.includes("sport") || n.includes("palestra")) return "🏋️";
    return "🏷️";
  };

  const tagColor = idx => {
    const cols = ["#007AFF","#AF52DE","#FF9500","#34C759","#FF3B30","#00C7BE","#FF2D55","#FFCC00"];
    return cols[idx % cols.length];
  };

  if (allTags.length === 0) {
    return (
      <div className="scroll-area">
        <div className="empty-state" style={{ paddingTop: 80 }}>
          <div className="empty-icon">🏷️</div>
          <div className="empty-title">Nessun tag ancora</div>
          <div className="empty-sub">Quando aggiungi una transazione,<br />usa il campo <b>Tag / Progetto</b> per raggruppare<br />spese correlate — es. "Vacanza Grecia 2025"</div>
        </div>
      </div>
    );
  }

  return (
    <div className="scroll-area">
      <div style={{ padding: "0 16px 4px", fontSize: 13, color: "var(--ios-gray)" }}>
        {allTags.length} progett{allTags.length !== 1 ? "i" : "o"} · tocca per il dettaglio
      </div>

      <div style={{ padding: "8px 16px" }}>
        {tagSummaries.map((s, idx) => {
          const isOpen = selected === s.tag;
          const color = tagColor(idx);
          const emoji = tagEmoji(s.tag);

          return (
            <div className="progetto-card" key={s.tag}>
              {/* Header — always visible */}
              <div className="progetto-header" onClick={() => setSelected(isOpen ? null : s.tag)}>
                <div className="progetto-icon" style={{ background: color + "18" }}>{emoji}</div>
                <div style={{ flex: 1, minWidth: 0 }}>
                  <div style={{ fontWeight: 800, fontSize: 16, color: "var(--ios-label)", whiteSpace: "nowrap", overflow: "hidden", textOverflow: "ellipsis" }}>{s.tag}</div>
                  <div style={{ fontSize: 12, color: "var(--ios-gray)", marginTop: 2 }}>
                    {s.count} spese · {s.dates[0] ? fmtDate(s.dates[0]) : ""}{s.dates.length > 1 ? ` → ${fmtDate(s.dates[s.dates.length - 1])}` : ""}
                  </div>
                </div>
                <div style={{ textAlign: "right", flexShrink: 0 }}>
                  <div style={{ fontSize: 18, fontWeight: 800, color: "#FF3B30" }}>−{fmt(s.exp)}</div>
                  {s.inc > 0 && <div style={{ fontSize: 12, color: "#34C759", fontWeight: 600 }}>+{fmt(s.inc)}</div>}
                </div>
                <div style={{ color: "var(--ios-gray2)", fontSize: 18, marginLeft: 6, transition: "transform .2s", transform: isOpen ? "rotate(90deg)" : "rotate(0deg)" }}>›</div>
              </div>

              {/* Body — expanded */}
              {isOpen && (
                <div className="progetto-body">
                  {/* Stats */}
                  <div className="progetto-stat-row">
                    <div className="progetto-stat">
                      <div className="progetto-stat-label">Uscite</div>
                      <div className="progetto-stat-val" style={{ color: "#FF3B30" }}>{fmtShort(s.exp)}</div>
                    </div>
                    <div className="progetto-stat">
                      <div className="progetto-stat-label">Entrate</div>
                      <div className="progetto-stat-val" style={{ color: "#34C759" }}>{fmtShort(s.inc)}</div>
                    </div>
                    <div className="progetto-stat">
                      <div className="progetto-stat-label">Saldo</div>
                      <div className="progetto-stat-val" style={{ color: s.net >= 0 ? "#34C759" : "#FF3B30" }}>{fmtShort(s.net)}</div>
                    </div>
                  </div>

                  {/* Category breakdown */}
                  {s.breakdown.length > 0 && (
                    <>
                      <div style={{ fontSize: 12, fontWeight: 700, color: "var(--ios-gray)", textTransform: "uppercase", letterSpacing: ".06em", marginBottom: 8 }}>Breakdown categorie</div>
                      {s.breakdown.map(({ cat, amt }) => {
                        const pct = s.exp > 0 ? Math.round(amt / s.exp * 100) : 0;
                        return (
                          <div key={cat.id || cat.name} style={{ marginBottom: 10 }}>
                            <div style={{ display: "flex", justifyContent: "space-between", marginBottom: 4 }}>
                              <span style={{ fontSize: 13, fontWeight: 600 }}>{cat.icon} {cat.name}</span>
                              <span style={{ fontSize: 13, fontWeight: 700 }}>{fmt(amt)} <span style={{ color: "var(--ios-gray)", fontWeight: 500 }}>({pct}%)</span></span>
                            </div>
                            <div className="prog-track">
                              <div className="prog-fill" style={{ width: `${pct}%`, background: cat.color }} />
                            </div>
                          </div>
                        );
                      })}
                    </>
                  )}

                  {/* Transactions list */}
                  <div style={{ fontSize: 12, fontWeight: 700, color: "var(--ios-gray)", textTransform: "uppercase", letterSpacing: ".06em", margin: "12px 0 8px" }}>Transazioni</div>
                  <div style={{ background: "var(--ios-fill)", borderRadius: 12, overflow: "hidden" }}>
                    {s.txs.sort((a, b) => b.date.localeCompare(a.date)).map((tx, i) => {
                      const cat = categories.find(c => c.id === tx.categoryId) || { icon: "📦", color: "#8E8E93" };
                      return (
                        <div key={tx.id} style={{ display: "flex", alignItems: "center", gap: 10, padding: "10px 12px", borderBottom: i < s.txs.length - 1 ? ".5px solid var(--ios-sep)" : "none" }}>
                          <div style={{ width: 32, height: 32, borderRadius: 9, background: cat.color + "22", display: "flex", alignItems: "center", justifyContent: "center", fontSize: 16, flexShrink: 0 }}>{cat.icon}</div>
                          <div style={{ flex: 1, minWidth: 0 }}>
                            <div style={{ fontSize: 13, fontWeight: 600, whiteSpace: "nowrap", overflow: "hidden", textOverflow: "ellipsis" }}>{tx.description}</div>
                            <div style={{ fontSize: 11, color: "var(--ios-gray)" }}>{fmtDate(tx.date)}</div>
                          </div>
                          <div style={{ fontSize: 14, fontWeight: 700, color: tx.type === "entrata" ? "#34C759" : "#FF3B30", flexShrink: 0 }}>
                            {tx.type === "entrata" ? "+" : "−"}{fmt(tx.amount)}
                          </div>
                        </div>
                      );
                    })}
                  </div>
                </div>
              )}
            </div>
          );
        })}
      </div>
    </div>
  );
}

function TxSheet({ tx, categories, allTags, onSave, onDelete, onClose }) {
  const [form, setForm] = useState({
    amount: tx?.amount?.toString() || "",
    type: tx?.type || "uscita",
    categoryId: tx?.categoryId || categories[0]?.id || "",
    date: tx?.date || todayStr(),
    paymentMethod: tx?.paymentMethod || "Carta di Debito",
    description: tx?.description || "",
    notes: tx?.notes || "",
    tag: tx?.tag || "",
  });
  const [catSearch, setCatSearch] = useState("");
  const [suggestion, setSuggestion] = useState(null);
  const [suggestionDismissed, setSuggestionDismissed] = useState(false);
  const set = (k, v) => setForm(p => ({ ...p, [k]: v }));

  // Smart suggestion: fires when description changes
  const handleDescChange = (val) => {
    set("description", val);
    setSuggestionDismissed(false);
    const s = suggestCategory(val, categories);
    // Only suggest if different from current selection
    setSuggestion(s && s.id !== form.categoryId ? s : null);
  };

  const acceptSuggestion = () => {
    if (suggestion) { set("categoryId", suggestion.id); }
    setSuggestion(null); setSuggestionDismissed(true);
  };

  const handleSave = () => {
    const amt = parseFloat(form.amount.replace(",", "."));
    if (!amt || amt <= 0) return alert("Inserisci un importo valido");
    if (!form.description.trim()) return alert("Inserisci una descrizione");
    onSave({ ...form, amount: amt, id: tx?.id || uid(), recurringId: tx?.recurringId, auto: tx?.auto });
  };

  const incomeCatIds = ["cat-stipendio","cat-freelance","cat-investimenti","cat-rimborso"];
  const allDisplay = form.type === "entrata"
    ? [...categories.filter(c => incomeCatIds.includes(c.id)), ...categories.filter(c => !incomeCatIds.includes(c.id))]
    : [...categories.filter(c => !incomeCatIds.includes(c.id)), ...categories.filter(c => incomeCatIds.includes(c.id))];

  const filteredCats = catSearch.trim()
    ? allDisplay.filter(c => c.name.toLowerCase().includes(catSearch.toLowerCase()))
    : allDisplay;

  const selectedCat = categories.find(c => c.id === form.categoryId);

  return (
    <Sheet title={tx ? "Modifica" : "Nuova Transazione"} onClose={onClose} onSave={handleSave} saveLabel="Salva">
      {/* Type toggle */}
      <div className="type-pills">
        <button className={`type-pill ${form.type === "uscita" ? "e" : ""}`} onClick={() => set("type", "uscita")}>↓ Uscita</button>
        <button className={`type-pill ${form.type === "entrata" ? "i" : ""}`} onClick={() => set("type", "entrata")}>↑ Entrata</button>
      </div>

      {/* Amount */}
      <div className="ios-input-group">
        <div className="amount-wrap">
          <span className="amount-sym">€</span>
          <input className="ios-input" type="number" inputMode="decimal" placeholder="0,00"
            value={form.amount} onChange={e => set("amount", e.target.value)} />
        </div>
      </div>

      {/* Description — triggers suggestion */}
      <div className="ios-input-group">
        <label className="ios-input-label">Descrizione</label>
        <input className="ios-input" type="text" placeholder="es. Pranzo al ristorante"
          value={form.description} onChange={e => handleDescChange(e.target.value)} />
      </div>

      {/* Smart suggestion banner */}
      {suggestion && !suggestionDismissed && (
        <div className="suggest-banner" onClick={acceptSuggestion}>
          <div className="suggest-icon-wrap" style={{ background: suggestion.color + "22" }}>
            {suggestion.icon}
          </div>
          <div className="suggest-label">
            <div className="suggest-label-top">✨ Categoria suggerita</div>
            <div className="suggest-label-name">{suggestion.name}</div>
          </div>
          <button className="suggest-accept" onClick={e => { e.stopPropagation(); acceptSuggestion(); }}>
            Usa
          </button>
        </div>
      )}

      {/* Category grid — ALL visible */}
      <div className="ios-input-group">
        <div style={{ display: "flex", alignItems: "center", justifyContent: "space-between", marginBottom: 8 }}>
          <label className="ios-input-label" style={{ margin: 0 }}>
            Categoria
            {selectedCat && (
              <span style={{ marginLeft: 8, background: selectedCat.color + "22", color: selectedCat.color, borderRadius: 8, padding: "2px 8px", fontSize: 12, fontWeight: 700 }}>
                {selectedCat.icon} {selectedCat.name}
              </span>
            )}
          </label>
          <span style={{ fontSize: 11, color: "var(--ios-gray)" }}>{filteredCats.length} cat.</span>
        </div>

        {/* Search within categories */}
        <div className="cat-search-bar">
          <span style={{ fontSize: 14, color: "var(--ios-gray2)" }}>🔍</span>
          <input placeholder="Cerca categoria..." value={catSearch} onChange={e => setCatSearch(e.target.value)} />
          {catSearch && <span style={{ cursor: "pointer", fontSize: 13, color: "var(--ios-gray2)" }} onClick={() => setCatSearch("")}>✕</span>}
        </div>

        {/* Full grid — all categories visible */}
        <div className="cat-grid-picker">
          {filteredCats.map(c => {
            const isActive = form.categoryId === c.id;
            return (
              <button
                key={c.id}
                className={`cat-grid-item ${isActive ? "active" : ""}`}
                style={isActive
                  ? { background: c.color, borderColor: c.color }
                  : { borderColor: "var(--ios-sep)" }
                }
                onClick={() => { set("categoryId", c.id); setSuggestion(null); }}
              >
                <div className="cat-grid-item-icon">{c.icon}</div>
                <div className="cat-grid-item-name" style={isActive ? { color: "#fff" } : {}}>
                  {c.name}
                </div>
              </button>
            );
          })}
        </div>
      </div>

      {/* Date */}
      <div className="ios-input-group">
        <label className="ios-input-label">Data</label>
        <input className="ios-input" type="date" value={form.date} onChange={e => set("date", e.target.value)} />
      </div>

      {/* Payment method */}
      <div className="ios-input-group">
        <label className="ios-input-label">Metodo di Pagamento</label>
        <select className="ios-input" value={form.paymentMethod} onChange={e => set("paymentMethod", e.target.value)}>
          {METODI_PAGAMENTO.map(m => <option key={m}>{m}</option>)}
        </select>
      </div>

      {/* Tag / Progetto */}
      <TagInput
        value={form.tag || ""}
        onChange={v => set("tag", v)}
        allTags={allTags}
      />

      {/* Notes */}
      <div className="ios-input-group">
        <label className="ios-input-label">Note (opzionale)</label>
        <input className="ios-input" type="text" placeholder="Note aggiuntive..."
          value={form.notes} onChange={e => set("notes", e.target.value)} />
      </div>

      <button className="ios-btn ios-btn-blue" onClick={handleSave} style={{ marginTop: 4, marginBottom: 10 }}>
        {tx ? "Salva Modifiche" : "Aggiungi Transazione"}
      </button>
      {tx && !tx.auto && (
        <button className="ios-btn ios-btn-red" onClick={() => onDelete(tx.id)}>
          Elimina Transazione
        </button>
      )}
    </Sheet>
  );
}

            <input type="checkbox" checked={form.enabled} onChange={e => set("enabled", e.target.checked)} />
            <div className="ios-toggle-track" />
          </label>
        </div>
      </div>
      <button className="ios-btn ios-btn-blue" onClick={handleSave} style={{ marginBottom: 10 }}>
        {rec ? "Salva" : "Aggiungi Spesa Ricorrente"}
      </button>
      {rec && <button className="ios-btn ios-btn-red" onClick={() => onDelete(rec.id)}>Elimina</button>}
    </Sheet>
  );
}

const AVATAR_EMOJIS = ["😊","😎","🧑","👨","👩","🧔","👦","👧","🧑‍💼","👨‍💼","👩‍💼","🧑‍🎨","🦸","🧙","🐻","🦊","🐯","🐼","🦁","🐸"];
const AVATAR_BG = ["#007AFF","#34C759","#FF3B30","#FF9500","#AF52DE","#FF2D55","#00C7BE","#FFCC00"];

// ─────────────────────────────────────────────────────────────
// ONBOARDING SCREEN
// ─────────────────────────────────────────────────────────────
function Onboarding({ onComplete }) {
  const [nome, setNome] = useState("");
  const [emoji, setEmoji] = useState("😊");
  const [bg, setBg] = useState("#007AFF");
  const [step, setStep] = useState(1); // 1=name, 2=avatar

  const handleNext = () => {
    if (!nome.trim()) return alert("Inserisci il tuo nome");
    setStep(2);
  };
  const handleDone = () => onComplete({ nome: nome.trim(), emoji, bg });

  return (
    <div className="onboard-screen">
      <div className="onboard-logo"><span style={{color:"rgba(255,255,255,.7)"}}>Super</span>AD<span style={{color:"rgba(255,255,255,.7)"}}>Wallet</span></div>
      <div className="onboard-sub">{step === 1 ? "Benvenuto! Come ti chiami?" : "Scegli il tuo avatar"}</div>

      {/* Avatar preview */}
      <div className="onboard-avatar-wrap">
        <div className="onboard-avatar" style={{ background: bg }}>
          <span style={{ fontSize: 52 }}>{emoji}</span>
        </div>
      </div>

      {step === 1 && (
        <>
          <input className="onboard-input" type="text" placeholder="Il tuo nome..."
            value={nome} onChange={e => setNome(e.target.value)}
            onKeyDown={e => e.key === "Enter" && handleNext()} autoFocus />

      {step === 2 && (
        <>
          {/* Emoji grid */}
          <div className="avatar-grid" style={{ marginBottom: 16, width: "100%" }}>
            {AVATAR_EMOJIS.map(em => (
              <div key={em} className={`avatar-opt ${emoji === em ? "sel" : ""}`}
                style={{ background: bg + "33" }} onClick={() => setEmoji(em)}>
                {em}
              </div>
            ))}
          </div>
          {/* Color row */}
          <div style={{ display: "flex", gap: 8, marginBottom: 20, flexWrap: "wrap", justifyContent: "center" }}>
            {AVATAR_BG.map(c => (
              <div key={c} onClick={() => setBg(c)} style={{
                width: 28, height: 28, borderRadius: "50%", background: c, cursor: "pointer",
                border: bg === c ? "3px solid #fff" : "3px solid transparent", transition: "transform .1s"
              }} />
            ))}
          </div>
          <button className="onboard-btn" onClick={handleDone}>Inizia a usare l'app ✓</button>
        </>
      )}
    </div>
  );
}

// ─────────────────────────────────────────────────────────────
// DASHBOARD
// ─────────────────────────────────────────────────────────────
function Dashboard({ transactions, categories, budgets, profile, onOpenTx, onEditProfile }) {
  const [period, setPeriod] = useState("mese");

  const rangeStart = { oggi: todayStr(), settimana: weekStart(), mese: monthStart(), anno: yearStart() }[period];
  const filtered = useMemo(() => transactions.filter(t => t.date >= rangeStart && t.date <= todayStr()), [transactions, period]);

  const totalInc = filtered.filter(t => t.type === "entrata").reduce((s, t) => s + t.amount, 0);
  const totalExp = filtered.filter(t => t.type === "uscita").reduce((s, t) => s + t.amount, 0);
  const balance = transactions.filter(t => t.type === "entrata").reduce((s, t) => s + t.amount, 0)
                - transactions.filter(t => t.type === "uscita").reduce((s, t) => s + t.amount, 0);

  const pieData = useMemo(() => {
    const m = {};
    filtered.filter(t => t.type === "uscita").forEach(t => { m[t.categoryId] = (m[t.categoryId] || 0) + t.amount; });
    return Object.entries(m).map(([id, val]) => {
      const cat = categories.find(c => c.id === id) || CATEGORY_PRESETS[CATEGORY_PRESETS.length - 1];
      return { name: cat.name, value: Math.round(val * 100) / 100, color: cat.color, icon: cat.icon };
    }).sort((a, b) => b.value - a.value).slice(0, 7);
  }, [filtered, categories]);

  const lineData = useMemo(() => {
    const days = [];
    for (let i = 6; i >= 0; i--) {
      const d = new Date(); d.setDate(d.getDate() - i);
      const ds = d.toISOString().split("T")[0];
      const label = d.toLocaleDateString("it-IT", { weekday: "short" });
      const exp = transactions.filter(t => t.date === ds && t.type === "uscita").reduce((s, t) => s + t.amount, 0);
      days.push({ label, uscite: Math.round(exp * 100) / 100 });
    }
    return days;
  }, [transactions]);

  const recent = [...transactions].sort((a, b) => b.date.localeCompare(a.date)).slice(0, 8);

  const budgetAlerts = budgets.filter(b => {
    const spent = transactions.filter(t => t.date >= monthStart() && t.categoryId === b.categoryId && t.type === "uscita").reduce((s, t) => s + t.amount, 0);
    return spent >= b.limit * 0.8;
  });

  const greeting = () => {
    const h = new Date().getHours();
    if (h < 12) return "Buongiorno";
    if (h < 18) return "Buon pomeriggio";
    return "Buonasera";
  };

  return (
    <div className="scroll-area">
      {/* Profile header */}
      <div className="profile-header">
        <div className="profile-avatar" style={{ background: profile?.bg || "#007AFF" }} onClick={onEditProfile}>
          <span style={{ fontSize: 24 }}>{profile?.emoji || "😊"}</span>
        </div>
        <div className="profile-greeting">
          <div className="profile-ciao">{greeting()},</div>
          <div className="profile-name">{profile?.nome || "Utente"} 👋</div>
        </div>
        <button className="profile-settings-btn" onClick={onEditProfile}>✏️</button>
      </div>

      {/* Balance card */}
      <div className="balance-card">
        <div className="balance-label">Saldo Totale</div>
        <div className="balance-amount">{fmt(balance)}</div>
        <div className="balance-pills">
          <div className="balance-pill">
            <div className="balance-pill-label">↑ ENTRATE</div>
            <div className="balance-pill-val">{fmtShort(totalInc)}</div>
          </div>
          <div className="balance-pill">
            <div className="balance-pill-label">↓ USCITE</div>
            <div className="balance-pill-val">{fmtShort(totalExp)}</div>
          </div>
        </div>
      </div>

      {/* Period chips */}
      <div className="period-scroll">
        {[["oggi", "Oggi"], ["settimana", "Settimana"], ["mese", "Mese"], ["anno", "Anno"]].map(([v, l]) => (
          <button key={v} className={`period-chip ${period === v ? "active" : ""}`} onClick={() => setPeriod(v)}>{l}</button>
        ))}
      </div>

      {/* Budget alert */}
      {budgetAlerts.length > 0 && (
        <div className="ios-section" style={{ marginTop: 12 }}>
          <div style={{ background: "rgba(255,149,0,.1)", border: ".5px solid rgba(255,149,0,.3)", borderRadius: 12, padding: "12px 16px" }}>
            <div style={{ fontWeight: 700, color: "#FF9500", marginBottom: 4 }}>⚠️ Attenzione Budget</div>
            {budgetAlerts.map(b => {
              const cat = categories.find(c => c.id === b.categoryId);
              const spent = transactions.filter(t => t.date >= monthStart() && t.categoryId === b.categoryId && t.type === "uscita").reduce((s, t) => s + t.amount, 0);
              return <div key={b.categoryId} style={{ fontSize: 13, color: "var(--ios-gray)" }}>{cat?.icon} {cat?.name}: {fmt(spent)} / {fmt(b.limit)}</div>;
            })}
          </div>
        </div>
      )}

      {/* Pie chart */}
      {pieData.length > 0 && (
        <div className="ios-section" style={{ marginTop: 12 }}>
          <div className="chart-card">
            <div className="chart-title">Spese per Categoria</div>
            <div className="chart-h-sm">
              <ResponsiveContainer width="100%" height="100%">
                <PieChart>
                  <Pie data={pieData} cx="50%" cy="50%" innerRadius={42} outerRadius={65} dataKey="value" paddingAngle={3}>
                    {pieData.map((e, i) => <Cell key={i} fill={e.color} />)}
                  </Pie>
                  <Tooltip contentStyle={{ background: "#fff", border: "none", borderRadius: 10, boxShadow: "0 4px 20px rgba(0,0,0,.12)", fontSize: 13 }} formatter={v => [fmt(v)]} />
                </PieChart>
              </ResponsiveContainer>
            </div>
            {pieData.map(e => (
              <div key={e.name} style={{ display: "flex", alignItems: "center", justifyContent: "space-between", marginTop: 8 }}>
                <div style={{ display: "flex", alignItems: "center", gap: 8 }}>
                  <div style={{ width: 8, height: 8, borderRadius: "50%", background: e.color }} />
                  <span style={{ fontSize: 13 }}>{e.icon} {e.name}</span>
                </div>
                <span style={{ fontSize: 13, fontWeight: 600, color: "var(--ios-gray)" }}>{fmt(e.value)}</span>
              </div>
            ))}
          </div>

          {/* Line chart */}
          <div className="chart-card">
            <div className="chart-title">Ultimi 7 giorni</div>
            <div className="chart-h">
              <ResponsiveContainer width="100%" height="100%">
                <LineChart data={lineData} margin={{ top: 5, right: 10, left: -20, bottom: 0 }}>
                  <CartesianGrid strokeDasharray="3 3" stroke="rgba(60,60,67,.1)" />
                  <XAxis dataKey="label" tick={{ fill: "#8E8E93", fontSize: 11 }} axisLine={false} tickLine={false} />
                  <YAxis tick={{ fill: "#8E8E93", fontSize: 10 }} axisLine={false} tickLine={false} />
                  <Tooltip contentStyle={{ background: "#fff", border: "none", borderRadius: 10, boxShadow: "0 4px 20px rgba(0,0,0,.12)", fontSize: 13 }} formatter={v => [fmt(v), "Uscite"]} />
                  <Line type="monotone" dataKey="uscite" stroke="#FF3B30" strokeWidth={2.5} dot={{ r: 4, fill: "#FF3B30" }} />
                </LineChart>
              </ResponsiveContainer>
            </div>
          </div>
        </div>
      )}

      {/* Recent tx */}
      <div className="ios-section" style={{ marginTop: 4 }}>
        <div className="ios-section-label">Recenti</div>
        {recent.length === 0
          ? <div className="empty-state"><div className="empty-icon">💸</div><div className="empty-title">Nessuna transazione</div><div className="empty-sub">Tocca + per aggiungere la tua prima transazione</div></div>
          : <div className="ios-group">{recent.map((tx, i) => <TxCell key={tx.id} tx={tx} categories={categories} onClick={onOpenTx} delay={i} />)}</div>
        }
      </div>
    </div>
  );
}

// ─────────────────────────────────────────────────────────────
// MOVIMENTI (history)
// ─────────────────────────────────────────────────────────────
function Movimenti({ transactions, categories, onOpenTx }) {
  const [search, setSearch] = useState("");
  const [filterType, setFilterType] = useState("tutti");
  const [filterCat, setFilterCat] = useState("all");

  const filtered = useMemo(() => {
    return [...transactions]
      .filter(t => {
        if (filterType === "uscite" && t.type !== "uscita") return false;
        if (filterType === "entrate" && t.type !== "entrata") return false;
        if (filterCat !== "all" && t.categoryId !== filterCat) return false;
        if (search && !t.description.toLowerCase().includes(search.toLowerCase())) return false;
        return true;
      })
      .sort((a, b) => b.date.localeCompare(a.date));
  }, [transactions, filterType, filterCat, search]);

  const exportCSV = () => {
    const rows = [["Data", "Descrizione", "Categoria", "Tipo", "Importo", "Metodo", "Note"]];
    filtered.forEach(t => {
      const cat = categories.find(c => c.id === t.categoryId)?.name || "Altro";
      rows.push([t.date, t.description, cat, t.type, t.amount, t.paymentMethod, t.notes || ""]);
    });
    const csv = rows.map(r => r.map(v => `"${v}"`).join(",")).join("\n");
    const a = document.createElement("a"); a.href = URL.createObjectURL(new Blob([csv], { type: "text/csv" }));
    a.download = `SuperADWallet_${todayStr()}.csv`; a.click();
  };

  // Group by date
  const grouped = useMemo(() => {
    const g = {};
    filtered.forEach(t => { if (!g[t.date]) g[t.date] = []; g[t.date].push(t); });
    return Object.entries(g).sort((a, b) => b[0].localeCompare(a[0]));
  }, [filtered]);

  return (
    <div className="scroll-area">
      <div className="ios-search-bar">
        <span>🔍</span>
        <input placeholder="Cerca movimenti..." value={search} onChange={e => setSearch(e.target.value)} />
        {search && <span style={{ cursor: "pointer", color: "var(--ios-gray)" }} onClick={() => setSearch("")}>✕</span>}
      </div>

      <div className="seg-ctrl">
        {[["tutti", "Tutti"], ["uscite", "Uscite"], ["entrate", "Entrate"]].map(([v, l]) => (
          <button key={v} className={`seg-btn ${filterType === v ? "active" : ""}`} onClick={() => setFilterType(v)}>{l}</button>
        ))}
      </div>

      <div style={{ padding: "0 16px 8px" }}>
        <select className="ios-input" style={{ fontSize: 14, padding: "10px 14px" }} value={filterCat} onChange={e => setFilterCat(e.target.value)}>
          <option value="all">Tutte le categorie</option>
          {categories.map(c => <option key={c.id} value={c.id}>{c.icon} {c.name}</option>)}
        </select>
      </div>

      <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", padding: "0 20px 6px" }}>
        <span style={{ fontSize: 13, color: "var(--ios-gray)" }}>{filtered.length} moviment{filtered.length !== 1 ? "i" : "o"}</span>
        <button onClick={exportCSV} style={{ background: "none", border: "none", color: "var(--ios-blue)", fontSize: 13, fontWeight: 600, cursor: "pointer", display: "flex", alignItems: "center", gap: 4 }}>
          <SFIcon name="download" size={14} color="var(--ios-blue)" /> CSV
        </button>
      </div>

      {grouped.length === 0
        ? <div className="empty-state"><div className="empty-icon">🔍</div><div className="empty-title">Nessun risultato</div><div className="empty-sub">Prova a modificare i filtri di ricerca</div></div>
        : grouped.map(([date, txs]) => (
          <div className="ios-section" key={date}>
            <div className="ios-section-label" style={{ marginTop: 10 }}>
              {fmtDateFull(date)}
              <span style={{ float: "right", color: "var(--ios-red)", fontWeight: 700 }}>
                −{fmt(txs.filter(t => t.type === "uscita").reduce((s, t) => s + t.amount, 0))}
              </span>
            </div>
            <div className="ios-group">
              {txs.map((tx, i) => <TxCell key={tx.id} tx={tx} categories={categories} onClick={onOpenTx} delay={i} />)}
            </div>
          </div>
        ))
      }
    </div>
  );
}

// RICORRENTI

function Ricorrenti({ recurrings, categories, onAdd, onEdit }) {
  const mensili = recurrings.filter(r => r.frequency === "mensile");
  const annuali = recurrings.filter(r => r.frequency === "annuale");
  const totMensile = mensili.filter(r => r.enabled).reduce((s, r) => s + r.amount, 0);
  const totAnnuale = annuali.filter(r => r.enabled).reduce((s, r) => s + r.amount, 0);

  const RecCard = ({ r }) => {
    const cat = categories.find(c => c.id === r.categoryId) || CATEGORY_PRESETS[CATEGORY_PRESETS.length - 1];
    return (
      <div className="ios-row" onClick={() => onEdit(r)}>
        <div className="ios-row-icon" style={{ background: cat.color + "22" }}>{cat.icon}</div>
        <div className="ios-row-content">
          <div className="ios-row-title" style={{ opacity: r.enabled ? 1 : .4 }}>{r.name}</div>
          <div className="ios-row-sub">Da {fmtDate(r.startDate)} · <span className={`freq-badge freq-${r.frequency}`}>{r.frequency}</span></div>
        </div>
        <div className="ios-row-right">
          <div style={{ textAlign: "right" }}>
            <div style={{ fontWeight: 700, color: "var(--ios-red)", fontSize: 15 }}>−{fmt(r.amount)}</div>
            {!r.enabled && <div style={{ fontSize: 11, color: "var(--ios-gray)" }}>disabilitato</div>}
          </div>
          <div className="ios-chevron">›</div>
        </div>
      </div>
    );
  };

  return (
    <div className="scroll-area">
      <div style={{ display: "flex", gap: 10, padding: "0 16px 12px" }}>
        <div style={{ flex: 1, background: "var(--ios-surface)", borderRadius: 14, padding: "14px 16px" }}>
          <div style={{ fontSize: 12, color: "var(--ios-gray)", fontWeight: 600 }}>MENSILE FISSO</div>
          <div style={{ fontSize: 22, fontWeight: 800, color: "var(--ios-red)", marginTop: 4 }}>−{fmt(totMensile)}</div>
        </div>
        <div style={{ flex: 1, background: "var(--ios-surface)", borderRadius: 14, padding: "14px 16px" }}>
          <div style={{ fontSize: 12, color: "var(--ios-gray)", fontWeight: 600 }}>ANNUALE FISSO</div>
          <div style={{ fontSize: 22, fontWeight: 800, color: "var(--ios-orange)", marginTop: 4 }}>−{fmt(totAnnuale)}</div>
        </div>
      </div>

      <div style={{ margin: "0 16px 14px", background: "rgba(0,122,255,.07)", borderRadius: 12, padding: "12px 14px", fontSize: 13, color: "var(--ios-gray)", lineHeight: 1.5 }}>
        🔄 Le spese ricorrenti vengono aggiunte automaticamente come transazioni nelle date di scadenza.
      </div>

      {mensili.length > 0 && (
        <div className="ios-section">
          <div className="ios-section-label">Mensili</div>
          <div className="ios-group">{mensili.map(r => <RecCard key={r.id} r={r} />)}</div>
        </div>
      )}
      {annuali.length > 0 && (
        <div className="ios-section">
          <div className="ios-section-label">Annuali</div>
          <div className="ios-group">{annuali.map(r => <RecCard key={r.id} r={r} />)}</div>
        </div>
      )}
      {recurrings.length === 0 && (
        <div className="empty-state"><div className="empty-icon">🔁</div><div className="empty-title">Nessuna spesa ricorrente</div><div className="empty-sub">Aggiungi affitto, abbonamenti,<br />utenze e altre spese fisse</div></div>
      )}
      <div style={{ padding: "12px 16px" }}>
        <button className="ios-btn ios-btn-blue" onClick={onAdd}>+ Aggiungi Spesa Ricorrente</button>
      </div>
    </div>
  );
}

// ─────────────────────────────────────────────────────────────
// RAPPORTI
// ─────────────────────────────────────────────────────────────
function Rapporti({ transactions, categories }) {
  const [period, setPeriod] = useState("mese");
  const start = { oggi: todayStr(), settimana: weekStart(), mese: monthStart(), anno: yearStart() }[period];
  const filtered = transactions.filter(t => t.date >= start && t.date <= todayStr());
  const exp = filtered.filter(t => t.type === "uscita");
  const inc = filtered.filter(t => t.type === "entrata");
  const totExp = exp.reduce((s, t) => s + t.amount, 0);
  const totInc = inc.reduce((s, t) => s + t.amount, 0);

  const bycat = useMemo(() => {
    const m = {};
    exp.forEach(t => { m[t.categoryId] = (m[t.categoryId] || 0) + t.amount; });
    return Object.entries(m).map(([id, amt]) => {
      const cat = categories.find(c => c.id === id) || CATEGORY_PRESETS[CATEGORY_PRESETS.length - 1];
      return { ...cat, amt, pct: totExp > 0 ? Math.round(amt / totExp * 100) : 0 };
    }).sort((a, b) => b.amt - a.amt);
  }, [exp, categories, totExp]);

  return (
    <div className="scroll-area">
      <div className="seg-ctrl">
        {[["oggi", "Oggi"], ["settimana", "Sett."], ["mese", "Mese"], ["anno", "Anno"]].map(([v, l]) => (
          <button key={v} className={`seg-btn ${period === v ? "active" : ""}`} onClick={() => setPeriod(v)}>{l}</button>
        ))}
      </div>

      <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr 1fr", gap: 8, padding: "0 16px 12px" }}>
        {[["Entrate", fmt(totInc), "#34C759"], ["Uscite", fmt(totExp), "#FF3B30"], ["Saldo", fmt(totInc - totExp), totInc - totExp >= 0 ? "#34C759" : "#FF3B30"]].map(([l, v, c]) => (
          <div key={l} style={{ background: "var(--ios-surface)", borderRadius: 12, padding: "12px 10px", textAlign: "center" }}>
            <div style={{ fontSize: 11, color: "var(--ios-gray)", fontWeight: 600 }}>{l.toUpperCase()}</div>
            <div style={{ fontSize: 14, fontWeight: 800, color: c, marginTop: 4, wordBreak: "break-all" }}>{v}</div>
          </div>
        ))}
      </div>

      {bycat.length > 0 ? (
        <div className="ios-section">
          <div className="ios-section-label">Uscite per Categoria</div>
          <div className="ios-group">
            {bycat.map(c => (
              <div key={c.id} style={{ padding: "12px 16px", borderBottom: ".5px solid var(--ios-sep)" }}>
                <div style={{ display: "flex", justifyContent: "space-between", marginBottom: 6 }}>
                  <span style={{ fontSize: 14, fontWeight: 600 }}>{c.icon} {c.name}</span>
                  <span style={{ fontSize: 14, fontWeight: 700 }}>{fmt(c.amt)} <span style={{ color: "var(--ios-gray)", fontWeight: 500, fontSize: 12 }}>({c.pct}%)</span></span>
                </div>
                <div className="prog-track">
                  <div className="prog-fill" style={{ width: `${c.pct}%`, background: c.color }} />
                </div>
              </div>
            ))}
          </div>
        </div>
      ) : (
        <div className="empty-state"><div className="empty-icon">📊</div><div className="empty-title">Nessun dato</div><div className="empty-sub">Nessuna spesa in questo periodo</div></div>
      )}
    </div>
  );
}

// ─────────────────────────────────────────────────────────────
// IMPOSTAZIONI
// ─────────────────────────────────────────────────────────────
function Impostazioni({ categories, budgets, transactions, onCatSave, onCatDelete, onBudgetSave, onBudgetDelete }) {
  const [showCatSheet, setShowCatSheet] = useState(false);
  const [editCat, setEditCat] = useState(null);
  const [showBudgetSheet, setShowBudgetSheet] = useState(false);
  const [editBudget, setEditBudget] = useState(null);
  const [budgetForm, setBudgetForm] = useState({ categoryId: "", limit: "" });
  const [catSearch, setCatSearch] = useState("");

  const openCat = (c = null) => { setEditCat(c); setShowCatSheet(true); };
  const openBudget = (b = null) => {
    setEditBudget(b);
    setBudgetForm(b ? { categoryId: b.categoryId, limit: b.limit.toString() } : { categoryId: categories[0]?.id || "", limit: "" });
    setShowBudgetSheet(true);
  };
  const saveBudget = () => {
    const lim = parseFloat(budgetForm.limit.replace(",", "."));
    if (!lim || lim <= 0) return alert("Inserisci un budget valido");
    onBudgetSave({ ...budgetForm, limit: lim, id: editBudget?.id || uid() });
    setShowBudgetSheet(false);
  };
  const exportAll = () => {
    const rows = [["Data", "Descrizione", "Categoria", "Tipo", "Importo", "Metodo", "Note"]];
    transactions.forEach(t => {
      const cat = categories.find(c => c.id === t.categoryId)?.name || "Altro";
      rows.push([t.date, t.description, cat, t.type, t.amount, t.paymentMethod, t.notes || ""]);
    });
    const csv = rows.map(r => r.map(v => `"${v}"`).join(",")).join("\n");
    const a = document.createElement("a"); a.href = URL.createObjectURL(new Blob([csv], { type: "text/csv" }));
    a.download = `SuperADWallet_export_${todayStr()}.csv`; a.click();
  };

  const filteredCats = categories.filter(c => c.name.toLowerCase().includes(catSearch.toLowerCase()));

  return (
    <div className="scroll-area">
      {/* Categories */}
      <div className="ios-section">
        <div className="ios-section-label" style={{ display: "flex", justifyContent: "space-between", alignItems: "center" }}>
          <span>Categorie ({categories.length})</span>
          <button onClick={() => openCat()} style={{ background: "none", border: "none", color: "var(--ios-blue)", fontSize: 13, fontWeight: 700, cursor: "pointer" }}>+ Nuova</button>
        </div>
        <div className="ios-search-bar" style={{ margin: "0 0 8px" }}>
          <span>🔍</span>
          <input placeholder="Cerca categorie..." value={catSearch} onChange={e => setCatSearch(e.target.value)} />
        </div>
        <div className="ios-group">
          {filteredCats.map(c => (
            <div key={c.id} className="ios-row" onClick={() => openCat(c)}>
              <div className="ios-row-icon" style={{ background: c.color + "22" }}>{c.icon}</div>
              <div className="ios-row-content"><div className="ios-row-title">{c.name}</div></div>
              <div className="ios-row-right"><div className="ios-chevron">›</div></div>
            </div>
          ))}
        </div>
      </div>

      {/* Budgets */}
      <div className="ios-section">
        <div className="ios-section-label" style={{ display: "flex", justifyContent: "space-between", alignItems: "center" }}>
          <span>Budget Mensili</span>
          <button onClick={() => openBudget()} style={{ background: "none", border: "none", color: "var(--ios-blue)", fontSize: 13, fontWeight: 700, cursor: "pointer" }}>+ Aggiungi</button>
        </div>
        {budgets.length === 0 && <div style={{ fontSize: 13, color: "var(--ios-gray)", padding: "0 4px 8px" }}>Imposta un budget per monitorare le spese mensili per categoria.</div>}
        {budgets.length > 0 && (
          <div className="ios-group">
            {budgets.map(b => {
              const cat = categories.find(c => c.id === b.categoryId);
              const spent = transactions.filter(t => t.date >= monthStart() && t.categoryId === b.categoryId && t.type === "uscita").reduce((s, t) => s + t.amount, 0);
              const pct = b.limit > 0 ? Math.min(100, Math.round(spent / b.limit * 100)) : 0;
              const col = pct >= 100 ? "#FF3B30" : pct >= 80 ? "#FF9500" : "#34C759";
              return (
                <div key={b.id} className="ios-row" onClick={() => openBudget(b)}>
                  <div className="ios-row-icon" style={{ background: (cat?.color || "#8E8E93") + "22" }}>{cat?.icon || "📦"}</div>
                  <div className="ios-row-content">
                    <div style={{ display: "flex", justifyContent: "space-between" }}>
                      <span style={{ fontWeight: 600, fontSize: 15 }}>{cat?.name}</span>
                      <span style={{ fontSize: 13, color: col, fontWeight: 700 }}>{pct}%</span>
                    </div>
                    <div style={{ fontSize: 12, color: "var(--ios-gray)", marginBottom: 5 }}>{fmt(spent)} / {fmt(b.limit)}</div>
                    <div className="prog-track"><div className="prog-fill" style={{ width: `${pct}%`, background: col }} /></div>
                  </div>
                  <div className="ios-chevron" style={{ marginLeft: 10 }}>›</div>
                </div>
              );
            })}
          </div>
        )}
      </div>

      {/* Data */}
      <div className="ios-section">
        <div className="ios-section-label">Dati e Privacy</div>
        <div className="ios-group">
          <div className="ios-row" onClick={exportAll}>
            <div className="ios-row-icon" style={{ background: "rgba(0,122,255,.12)" }}>📤</div>
            <div className="ios-row-content"><div className="ios-row-title">Esporta CSV</div><div className="ios-row-sub">{transactions.length} transazioni</div></div>
            <div className="ios-chevron">›</div>
          </div>
        </div>
      </div>

      <div style={{ textAlign: "center", padding: "20px 0 8px", color: "var(--ios-gray)", fontSize: 12 }}>
        SuperADWallet · Tutti i dati salvati localmente
      </div>

      {/* SHEETS */}
      {showCatSheet && (
        <CatSheet cat={editCat}
          onSave={c => { onCatSave(c); setShowCatSheet(false); }}
          onDelete={id => { onCatDelete(id); setShowCatSheet(false); }}
          onClose={() => setShowCatSheet(false)} />
      )}
      {showBudgetSheet && (
        <Sheet title={editBudget ? "Modifica Budget" : "Nuovo Budget"} onClose={() => setShowBudgetSheet(false)} onSave={saveBudget} saveLabel="Salva">
          <div className="ios-input-group">
            <label className="ios-input-label">Categoria</label>
            <select className="ios-input" value={budgetForm.categoryId} onChange={e => setBudgetForm(p => ({ ...p, categoryId: e.target.value }))}>
              {categories.map(c => <option key={c.id} value={c.id}>{c.icon} {c.name}</option>)}
            </select>
          </div>
          <div className="ios-input-group">
            <label className="ios-input-label">Limite Mensile</label>
            <div className="amount-wrap">
              <span className="amount-sym" style={{ fontSize: 20 }}>€</span>
              <input className="ios-input" type="number" inputMode="decimal" placeholder="0,00" style={{ fontSize: 22 }}
                value={budgetForm.limit} onChange={e => setBudgetForm(p => ({ ...p, limit: e.target.value }))} />
            </div>
          </div>
          <button className="ios-btn ios-btn-blue" onClick={saveBudget} style={{ marginBottom: 10 }}>Salva Budget</button>
          {editBudget && <button className="ios-btn ios-btn-red" onClick={() => { onBudgetDelete(editBudget.id); setShowBudgetSheet(false); }}>Elimina Budget</button>}
        </Sheet>
      )}
    </div>
  );
}

// ─────────────────────────────────────────────────────────────
// ROOT
// ─────────────────────────────────────────────────────────────
function App() {
  injectCSS(CSS);
  const [tab, setTab] = useState("dashboard");
  const [categories, setCategories] = useState(() => load("saw_cats", CATEGORY_PRESETS));
  const [recurrings, setRecurrings] = useState(() => load("saw_rec", []));
  const [budgets, setBudgets] = useState(() => load("saw_budgets", []));
  const [transactions, setTransactions] = useState(() => load("saw_tx", []));
  const [profile, setProfile] = useState(() => load("saw_profile", null));
  const [showProfileSheet, setShowProfileSheet] = useState(false);

  const [showTxSheet, setShowTxSheet] = useState(false);
  const [editTx, setEditTx] = useState(null);
  const [showRecSheet, setShowRecSheet] = useState(false);
  const [editRec, setEditRec] = useState(null);

  // Auto-process recurring
  useEffect(() => {
    const newTx = processRecurring(recurrings, transactions);
    if (newTx.length > 0) {
      setTransactions(prev => { const u = [...prev, ...newTx]; save("saw_tx", u); return u; });
    }
  }, [recurrings]);

  useEffect(() => save("saw_cats", categories), [categories]);
  useEffect(() => save("saw_rec", recurrings), [recurrings]);
  useEffect(() => save("saw_budgets", budgets), [budgets]);
  useEffect(() => { if (profile) save("saw_profile", profile); }, [profile]);

  const saveTx = useCallback(tx => {
    setTransactions(prev => { const i = prev.findIndex(t => t.id === tx.id); const u = i >= 0 ? prev.map(t => t.id === tx.id ? tx : t) : [...prev, tx]; save("saw_tx", u); return u; });
    setShowTxSheet(false); setEditTx(null);
  }, []);
  const deleteTx = useCallback(id => {
    setTransactions(prev => { const u = prev.filter(t => t.id !== id); save("saw_tx", u); return u; });
    setShowTxSheet(false); setEditTx(null);
  }, []);
  const saveCat = useCallback(cat => setCategories(prev => { const i = prev.findIndex(c => c.id === cat.id); return i >= 0 ? prev.map(c => c.id === cat.id ? cat : c) : [...prev, cat]; }), []);
  const deleteCat = useCallback(id => setCategories(prev => prev.filter(c => c.id !== id)), []);
  const saveRec = useCallback(rec => { setRecurrings(prev => { const i = prev.findIndex(r => r.id === rec.id); return i >= 0 ? prev.map(r => r.id === rec.id ? rec : r) : [...prev, rec]; }); setShowRecSheet(false); setEditRec(null); }, []);
  const deleteRec = useCallback(id => { setRecurrings(prev => prev.filter(r => r.id !== id)); setShowRecSheet(false); setEditRec(null); }, []);
  const saveBudget = useCallback(b => setBudgets(prev => { const i = prev.findIndex(x => x.categoryId === b.categoryId); return i >= 0 ? prev.map(x => x.categoryId === b.categoryId ? b : x) : [...prev, b]; }), []);
  const deleteBudget = useCallback(id => setBudgets(prev => prev.filter(b => b.id !== id)), []);

  const openTx = tx => { setEditTx(tx); setShowTxSheet(true); };
  const allTags = useMemo(() => [...new Set(transactions.map(t => t.tag).filter(Boolean))].sort(), [transactions]);

  const NAV = [
    { id: "dashboard",   label: "Home",      icon: "home"   },
    { id: "movimenti",   label: "Movimenti", icon: "list"   },
    { id: "progetti",    label: "Progetti",  icon: "tag"    },
    { id: "rapporti",    label: "Rapporti",  icon: "chart"  },
    { id: "impostazioni",label: "Impost.",   icon: "gear"   },
  ];

  const now = new Date();
  const timeStr = now.toLocaleTimeString("it-IT", { hour: "2-digit", minute: "2-digit" });
  const pageTitle = { dashboard: "SuperADWallet", movimenti: "Movimenti", progetti: "Progetti & Tag", rapporti: "Rapporti", impostazioni: "Impostazioni" }[tab];

  // Show onboarding if no profile yet
  if (!profile) {
    return (
      <div className="phone">
        <Onboarding onComplete={p => { setProfile(p); save("saw_profile", p); }} />
      </div>
    );
  }

  return (
    <div className="phone">
      {/* Status bar */}
      <div className="status-bar">
        <div className="status-time">{timeStr}</div>
        <div style={{ width: 80, height: 30, background: "#000", borderRadius: 20, position: "absolute", left: "50%", transform: "translateX(-50%)", top: 8 }} />
        <div className="status-icons">
          <svg viewBox="0 0 24 24"><path d="M1 8l4 4 4-4 4 4 4-4 4 4" stroke="#000" strokeWidth="2" strokeLinecap="round" fill="none" /></svg>
          <svg viewBox="0 0 24 24"><path d="M5 12.55a11 11 0 0114.08 0M1.42 9a16 16 0 0121.16 0M8.53 16.11a6 6 0 016.95 0M12 20h.01" stroke="#000" strokeWidth="2" strokeLinecap="round" fill="none" /></svg>
          <svg viewBox="0 0 24 24"><rect x="2" y="7" width="18" height="11" rx="2" stroke="#000" strokeWidth="2" fill="none" /><path d="M22 11v3" stroke="#000" strokeWidth="2" strokeLinecap="round" /><rect x="4" y="9" width="12" height="7" rx="1" fill="#000" /></svg>
        </div>
      </div>

      {/* Page title — hidden on dashboard (replaced by profile header) */}
      {tab !== "dashboard" && (
        <div style={{ padding: "2px 20px 10px", background: "var(--ios-bg)" }}>
          <div style={{ fontSize: 22, fontWeight: 900, letterSpacing: "-.5px", color: "var(--ios-label)" }}>{pageTitle}</div>
        </div>
      )}

      {/* Content */}
      {tab === "dashboard"    && <Dashboard    transactions={transactions} categories={categories} budgets={budgets} profile={profile} onOpenTx={openTx} onEditProfile={() => setShowProfileSheet(true)} />}
      {tab === "movimenti"    && <Movimenti    transactions={transactions} categories={categories} onOpenTx={openTx} />}
      {tab === "progetti"     && <Progetti     transactions={transactions} categories={categories} />}
      {tab === "rapporti"     && <Rapporti     transactions={transactions} categories={categories} />}
      {tab === "impostazioni" && <Impostazioni categories={categories} budgets={budgets} transactions={transactions} onCatSave={saveCat} onCatDelete={deleteCat} onBudgetSave={saveBudget} onBudgetDelete={deleteBudget} />}

      {/* FAB */}
      <button className="fab" onClick={() => { setEditTx(null); setShowTxSheet(true); }}>＋</button>

      {/* Bottom nav */}
      <nav className="nav-bar">
        {NAV.map(n => (
          <button key={n.id} className={`nav-item ${tab === n.id ? "active" : ""}`} onClick={() => setTab(n.id)}>
            <div className="nav-icon"><SFIcon name={n.icon} size={20} color={tab === n.id ? "#007AFF" : "#8E8E93"} /></div>
            <div className="nav-label">{n.label}</div>
          </button>
        ))}
      </nav>

      {/* Sheets */}
      {showTxSheet    && <TxSheet      tx={editTx}   categories={categories} allTags={allTags} onSave={saveTx}  onDelete={deleteTx}  onClose={() => { setShowTxSheet(false);  setEditTx(null);  }} />}
      {showRecSheet   && <RecSheet     rec={editRec}  categories={categories}                  onSave={saveRec} onDelete={deleteRec} onClose={() => { setShowRecSheet(false); setEditRec(null); }} />}
      {showProfileSheet && <ProfileSheet profile={profile} onSave={p => { setProfile(p); save("saw_profile", p); }} onClose={() => setShowProfileSheet(false)} />}
    </div>
  );
}

    // ── Mount ───────────────────────────────────────────────────
    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(React.createElement(App));

    // ── Service Worker for offline/PWA ──────────────────────────
    if ('serviceWorker' in navigator) {
      const swCode = `
        const CACHE = 'saw-v1';
        const ASSETS = [location.href];
        self.addEventListener('install', e => e.waitUntil(
          caches.open(CACHE).then(c => c.addAll(ASSETS))
        ));
        self.addEventListener('fetch', e => e.respondWith(
          caches.match(e.request).then(r => r || fetch(e.request))
        ));
      `;
      const blob = new Blob([swCode], {type: 'application/javascript'});
      const swUrl = URL.createObjectURL(blob);
      navigator.serviceWorker.register(swUrl).catch(() => {});
    }
  </script>
</body>
</html>
